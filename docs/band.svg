<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" aria-labelledby="t d">
  <title id="t">status-band above the prompt</title>
  <desc id="d">Two states of the band: idle with the cache countdown, and right after an advisor call.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; fill: #e8e8e8; white-space: pre; }
    .cap { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b8b8b; }
    .dim { fill: #8b8b8b; }
    .ok { fill: #30a46c; }
    .pro { fill: #b18ce8; }
    .b { font-weight: bold; }
  </style>
  <rect width="900" height="168" rx="12" fill="#121212"/>

  <text class="cap" x="20" y="26">Idle</text>
  <rect x="12" y="36" width="876" height="40" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <text x="28" y="61"><tspan class="ok">● </tspan><tspan class="dim">Context </tspan><tspan class="b">12%</tspan><tspan class="dim"> │ </tspan><tspan class="ok">● </tspan><tspan class="dim">5h </tspan><tspan class="b">4%</tspan><tspan class="dim"> │ </tspan><tspan class="ok">● </tspan><tspan class="dim">Week </tspan><tspan class="b">1%</tspan><tspan class="dim"> │ </tspan><tspan class="pro">✦ </tspan><tspan class="dim">Advisor </tspan><tspan class="b">3</tspan></text>
  <text x="872" y="61" text-anchor="end"><tspan class="ok">◆ </tspan><tspan class="dim">Cache warm </tspan><tspan class="b">57:57</tspan><tspan class="dim">  ·  ≈ $0.46  ▾</tspan></text>

  <text class="cap" x="20" y="108">Right after an advisor call (for a few seconds)</text>
  <rect x="12" y="118" width="876" height="40" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <text x="28" y="143"><tspan class="ok">● </tspan><tspan class="dim">Context </tspan><tspan class="b">12%</tspan><tspan class="dim"> │ </tspan><tspan class="ok">● </tspan><tspan class="dim">5h </tspan><tspan class="b">4%</tspan><tspan class="dim"> │ </tspan><tspan class="ok">● </tspan><tspan class="dim">Week </tspan><tspan class="b">1%</tspan><tspan class="dim"> │ </tspan><tspan class="pro">✦ </tspan><tspan class="dim">Advisor </tspan><tspan class="b">3</tspan></text>
  <text x="872" y="143" text-anchor="end"><tspan class="pro b">✦ Advisor consulted</tspan><tspan class="dim"> · #3 · 6s · Ctrl+O to read  ▾</tspan></text>
</svg>
